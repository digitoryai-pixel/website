# Render Blueprint for Digitory Controller (controller/). The marketing site stays on Vercel.
# Render → New → Blueprint → pick this repo. Creates the database, API and web app in Singapore.
databases:
  - name: controller-db
    plan: basic-256mb
    region: singapore
    databaseName: controller
    user: digitory

services:
  - type: web
    name: controller-api
    runtime: node
    plan: starter            # always on, so the 05:30 day close and 08:00 flash run
    region: singapore
    rootDir: controller/api
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    # Demo data is loaded once, on the first start; later deploys never wipe data.
    startCommand: node dist/prisma/seed.js --if-empty && npm start
    healthCheckPath: /api/health
    disk:
      name: evidence
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: controller-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: POS_INGEST_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: QUIET_NOTIFY
        value: "1"
      - key: ANTHROPIC_API_KEY   # optional: enables Ask Controller
        sync: false
      - key: WHATSAPP_TOKEN      # optional: WhatsApp Business Cloud API
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  - type: web
    name: controller-web
    runtime: node
    plan: starter
    region: singapore
    rootDir: controller/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Private address of the API; the web app proxies /api to it.
      - key: API_HOSTPORT
        fromService:
          type: web
          name: controller-api
          property: hostport
